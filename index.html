:root{
  --ink:#171629;
  --deep:#101426;
  --night:#171a38;
  --purple:#5d3f8e;
  --purple-2:#8b6cc1;
  --blue:#67d5ff;
  --cyan:#8ff6e8;
  --gold:#ffd56a;
  --paper:#f7f2e9;
  --stone:#d9d4c7;
  --stone-2:#b8b1a6;
  --panel:#f8f5ee;
  --pink:#ff9ec9;
  --green:#8de0a8;
}
*{box-sizing:border-box;margin:0;padding:0}
svg,img,.pixel{image-rendering:pixelated;shape-rendering:crispEdges}
body{
  min-height:100vh; display:flex; justify-content:center; align-items:center;
  padding:20px; background:radial-gradient(circle at 50% 15%,#28305f 0,#13162e 45%,#090b18 100%);
  color:var(--ink); font-family:'NeoDunggeunmo','Pretendard',sans-serif;
}
.game-container{
  width:100%; max-width:460px; height:880px; max-height:95vh; overflow:hidden;
  background:var(--paper); border:6px solid #0a0911; box-shadow:10px 10px 0 rgba(0,0,0,.55);
  display:flex; flex-direction:column; position:relative;
}
@media(max-width:480px),(max-height:760px){
  body{padding:0;background:#0b0d1e}
  .game-container{max-width:100%;height:100vh;max-height:100vh;border:0;box-shadow:none}
}
.top-hud{
  min-height:62px; padding:10px 12px; background:linear-gradient(90deg,#2c224b,#49336e);
  border-bottom:4px solid #0a0911; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-shrink:0;
}
.hud-title{display:flex;align-items:center;gap:9px;color:white;min-width:0}
.hud-badge{
  font-family:'Press Start 2P',monospace;font-size:8px;line-height:1.4;background:#11162d;color:var(--cyan);
  border:2px solid #0a0911;padding:7px 6px;box-shadow:2px 2px 0 #0a0911;white-space:nowrap;
}
#headerTitle{font-size:14px;line-height:1.25;font-weight:bold;word-break:keep-all}
.lang-toggle{display:flex;gap:4px;flex-shrink:0}
.lang-btn{border:2px solid #0a0911;background:#f7f2e9;color:#777;font-family:'Press Start 2P';font-size:8px;padding:5px 6px;cursor:pointer}
.lang-btn.active{background:var(--cyan);color:#171629}

/* magical science lab scene */
.lab-room{
  height:36%; min-height:250px; position:relative; overflow:hidden; flex-shrink:0;

}

.moon{position:absolute;width:18px;height:18px;border-radius:50%;background:#ffe78a;right:9px;top:8px;box-shadow:0 0 14px #ffe78a}

.shelf{position:absolute;left:132px;top:24px;width:105px;height:10px;background:#4a3529;border:3px solid #1a1420;box-shadow:0 52px 0 #4a3529,0 55px 0 #1a1420}
.book{position:absolute;top:35px;width:9px;border:2px solid #1a1420}.b1{left:137px;height:27px;background:#8d4f78}.b2{left:147px;height:31px;background:#4e77a8}.b3{left:158px;height:25px;background:#c39551}.b4{left:169px;height:29px;background:#567f61}
.potion{position:absolute;width:15px;height:18px;border:3px solid #1a1420;background:#74f0db;top:40px}.p1{left:194px}.p2{left:214px;background:#d188ff}

.telescope{position:absolute;left:124px;bottom:64px;width:66px;height:70px}

.telescope .lens{position:absolute;width:15px;height:22px;background:#69e7ff;border:4px solid #1a1420;transform:rotate(-28deg);top:-2px;left:39px}

.lab-table{position:absolute;left:19px;right:18px;bottom:43px;height:32px;background:#6a4c3b;border:4px solid #17121c;z-index:5;box-shadow:inset 0 5px 0 #9b775b}
.lab-table:after{content:"";position:absolute;width:8px;height:46px;background:#4b352c;border:3px solid #17121c;left:18px;top:27px;box-shadow:320px 0 0 #4b352c,320px 0 0 0 #17121c}
.flask{position:absolute;bottom:71px;width:26px;height:35px;z-index:8}
.flask.f1{left:225px}.flask.f2{left:257px;transform:scale(.82);transform-origin:bottom}
.flask .neck{position:absolute;width:10px;height:15px;left:8px;top:0;background:#d7f3ff;border:3px solid #17121c;border-bottom:0}

.flask.f2 .body{background:#cf80ff}
.bubble{position:absolute;border:2px solid #17121c;background:#b9fff3;width:6px;height:6px;animation:bubbles 1.1s steps(3) infinite;z-index:9}.bb1{left:235px;bottom:102px}.bb2{left:271px;bottom:105px;animation-delay:.4s}

.scientist{position:absolute;left:20px;bottom:66px;width:76px;height:92px;z-index:9;transition:transform .2s steps(2);filter:drop-shadow(3px 4px 0 rgba(23,18,28,.25))}
.scientist.cheer{animation:cheer .35s steps(2) 2}@keyframes cheer{50%{transform:translateY(-8px)}}
.scientist svg{width:100%;height:100%;display:block;image-rendering:pixelated;shape-rendering:crispEdges}
.ls-outline{fill:#17121c}.ls-hair{fill:#4b354f}.ls-skin{fill:#f3c9a9}.ls-goggle{fill:#72def5}.ls-eye{fill:#183346}.ls-blush{fill:#e7a4ad}.ls-mouth{fill:#9b5a61}.ls-shirt{fill:#f4efe8}.ls-accent{fill:#765f9b}.ls-coat{fill:#e8e6e0}.ls-leg{fill:#373044}.ls-shoe{fill:#1b1724}

/* creation chamber */
.chamber{position:absolute;right:26px;bottom:66px;width:102px;height:142px;z-index:7}
.chamber-top,.chamber-base{position:absolute;left:7px;width:88px;height:17px;background:#34283f;border:4px solid #17121c;z-index:3}.chamber-top{top:0}.chamber-base{bottom:0;height:21px;background:#443653}
.chamber-glass{position:absolute;left:14px;top:14px;width:74px;height:111px;border:4px solid #17121c;background:linear-gradient(180deg,rgba(116,232,255,.28),rgba(139,96,200,.23));box-shadow:inset 0 0 16px rgba(104,244,232,.5);overflow:hidden}
.chamber-ring{position:absolute;left:1px;right:1px;height:5px;background:#8ff6e8;opacity:.6;animation:scan 1.8s linear infinite}@keyframes scan{0%{top:4px}100%{top:102px}}
.orb{position:absolute;width:15px;height:15px;border:3px solid #17121c;background:#ffd56a;display:none;z-index:10;animation:orbFloat .8s steps(4) infinite alternate}@keyframes orbFloat{to{transform:translateY(-5px) rotate(90deg)}}
.orb.show{display:block}.orb.o1{left:33px;top:34px}.orb.o2{right:29px;top:58px}.orb.o3{left:30px;bottom:39px}.orb.o4{right:28px;bottom:33px}
.char-preview{position:absolute;left:18px;top:18px;width:70px;height:104px;display:none;z-index:4;animation:reveal .8s steps(5)}
.char-preview.show{display:block}@keyframes reveal{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
.char-preview svg{width:100%;height:100%;display:block;image-rendering:pixelated;shape-rendering:crispEdges}
.pv-outline{fill:#17121c}.pv-hair{fill:var(--char-dark,#2f2741)}.pv-skin{fill:#f3d7c0}.pv-eye{fill:#cfdfef}.pv-blush{fill:#e8afb8}.pv-shirt{fill:#f4efe7}.pv-accent{fill:var(--char-color,#67d5ff)}.pv-coat{fill:#4b3a64}.pv-leg{fill:#2d2944}.pv-shoe{fill:#1d1828}
.spark{position:absolute;color:#ffe78a;font-size:18px;display:none;text-shadow:2px 2px 0 #17121c;z-index:12}.spark.show{display:block;animation:sparkle .9s steps(3) infinite}.spark.sp1{right:13px;top:22px}.spark.sp2{left:5px;top:76px;animation-delay:.3s}@keyframes sparkle{50%{transform:scale(1.4);opacity:.5}}

.lab-room:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(90deg,#241a31 0 12px,#3d2a50 12px 24px);border-bottom:3px solid #17121c;z-index:2}

.dialogue-section{flex:1;min-height:0;padding:12px;background:linear-gradient(180deg,#e7e2d8,#d6d0c5);overflow-y:auto}

.q-meta{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.btn-back{background:#fff;border:3px solid #17121c;box-shadow:2px 2px 0 #17121c;padding:7px 10px;font-family:'NeoDunggeunmo';font-size:12px;cursor:pointer}.btn-back:active{transform:translate(2px,2px);box-shadow:none}.btn-back.is-hidden{visibility:hidden;pointer-events:none}
.step-counter{font-family:'Press Start 2P';font-size:9px;color:#49336e}
.hud-step-dots{display:flex;gap:5px;margin-left:auto}.step-dot{width:9px;height:9px;background:#c5c0bb;border:2px solid #17121c}.step-dot.done{background:#8ff6e8}.step-dot.active{background:#ffd56a}
.q-title{font-size:17px;line-height:1.35;margin-bottom:5px}.q-hint{font-size:11px;color:#68636f;line-height:1.45;margin-bottom:13px}
.options-box{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding-bottom:8px}.group-header{grid-column:1/-1;margin-top:8px;padding:5px 4px;border-bottom:2px dashed #aaa0aa;color:#49336e;font-size:13px;display:flex;gap:6px;align-items:center}
.option-btn{position:relative;min-height:67px;background:white;border:4px solid #17121c;box-shadow:4px 4px 0 #aaa3a8;padding:7px 5px;font-family:'NeoDunggeunmo';font-size:11px;color:#17121c;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;line-height:1.25}.option-btn:active{transform:translate(4px,4px);box-shadow:none}.option-btn.selected{background:#e7dcff;box-shadow:inset 4px 4px 0 rgba(0,0,0,.12)}
.option-icon{height:29px;min-width:29px;display:flex;align-items:center;justify-content:center;font-size:24px}.pixel-icon{font-family:'Press Start 2P';font-size:13px;background:#211a35;color:#8ff6e8;padding:6px;border:2px solid #17121c}
.color-swatch{width:32px;height:32px;border:3px solid #17121c;box-shadow:2px 2px 0 #aaa}.rainbow{background:linear-gradient(135deg,#ff5858,#ffb64d,#ffe45e,#6fe081,#62c7ff,#7668ff,#cf68e8)}
.style-label{font-size:10px;color:#777}.result-title{font-size:15px;color:#49336e;text-align:center;margin-bottom:10px}.result-card{background:#fffdf7;border:4px solid #17121c;padding:12px;line-height:1.65;font-size:12px;word-break:keep-all;box-shadow:4px 4px 0 #bcb3bc}.result-summary{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px}.summary-chip{background:#eee6ff;border:2px solid #17121c;padding:6px;font-size:10px;line-height:1.3;text-align:center}.btn-row{display:flex;gap:8px;margin-top:12px}.action-btn{flex:1;border:4px solid #17121c;box-shadow:4px 4px 0 #17121c;padding:11px 5px;font-family:'NeoDunggeunmo';font-size:12px;cursor:pointer}.action-btn:active{transform:translate(4px,4px);box-shadow:none}.copy{background:#ffd56a}.restart{background:#8ff6e8}
.lab-status{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;z-index:14;background:#17121c;color:#8ff6e8;border:2px solid #0a0911;padding:5px 9px;font-size:10px;white-space:nowrap;box-shadow:2px 2px 0 rgba(0,0,0,.35)}
@media(max-width:380px){.options-box{gap:6px}.option-btn{font-size:10px;min-height:61px}.lab-room{min-height:226px}.chamber{right:12px}.telescope{display:none}.lab-table:after{box-shadow:285px 0 0 #4b352c,285px 0 0 0 #17121c}}

/* wall: smaller stone blocks + tiny wear pixels */
.stone-wall{
  inset:0 0 64px;
  background-color:#c8c4bb;
  background-image:
    linear-gradient(90deg,transparent 0 7px,rgba(75,65,78,.13) 7px 8px,transparent 8px 15px),
    linear-gradient(transparent 0 7px,rgba(75,65,78,.13) 7px 8px,transparent 8px 15px),
    linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px);
  background-size:16px 12px,16px 12px,8px 8px,8px 8px;
  opacity:1;
}
.stone-wall:before{
  content:"";position:absolute;inset:8px 9px 4px;
  background:
    linear-gradient(90deg,transparent 0 2px,#8f8b87 2px 3px,transparent 3px) 10px 18px/37px 31px,
    linear-gradient(transparent 0 2px,#9d9892 2px 3px,transparent 3px) 24px 7px/51px 29px;
  opacity:.28;
}
.stone-wall:after{
  background:
    linear-gradient(180deg,rgba(30,32,63,.19),transparent 42%,rgba(42,29,67,.16)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 6px);
}

let lang='ko',step=0,answers={},transitioning=false;
const els={header:document.getElementById('headerTitle'),status:document.getElementById('labStatus'),back:document.getElementById('btnBack'),counter:document.getElementById('stepCounter'),dots:document.getElementById('stepDots'),content:document.getElementById('contentArea'),scientist:document.getElementById('scientist'),preview:document.getElementById('charPreview')};

function label(obj){return obj[lang]}
function updateHud(){
  const txt=I18N[lang]; els.header.textContent=txt.header; els.status.textContent= step>=FLOW.length ? txt.complete : txt.status; els.back.textContent=txt.back;
  if(step>=FLOW.length){els.counter.textContent='LAB DONE';els.dots.innerHTML=FLOW.map(()=>'<div class="step-dot done"></div>').join('');els.back.classList.add('is-hidden');document.getElementById('museumLogo').hidden=false;return}
  document.getElementById('museumLogo').hidden=true;
  els.counter.textContent=`LAB 0${step+1} / 0${FLOW.length}`;
  els.dots.innerHTML=FLOW.map((_,i)=>`<div class="step-dot ${i<step?'done':i===step?'active':''}"></div>`).join('');
  els.back.classList.toggle('is-hidden',step===0);
}
function selectedFor(key,id){return answers[key]&&answers[key].id===id?'selected':''}
function animateIngredient(index,color){
  const orb=document.getElementById('orb'+(index+1));orb.classList.add('show');orb.style.background=color==='rainbow'?'linear-gradient(135deg,#ff868f,#ffcf65,#97df93,#66d9ef,#bd9bff)':color||['#66d9ef','#bd9bff','#ffcf65','#ff9b78','#97df93','#ff86b7'][index];
  els.scientist.classList.remove('cheer');void els.scientist.offsetWidth;els.scientist.classList.add('cheer');
}
function restoreChamber(){
  for(let i=0;i<FLOW.length;i++){const orb=document.getElementById('orb'+(i+1));orb.classList.toggle('show',!!answers[FLOW[i].key]);}
  if(answers.color){
    const c=answers.color.hex==='rainbow'?'#9a69db':answers.color.hex;
    document.documentElement.style.setProperty('--char-color',c);
    const darkMap={red:'#6d2f35',orange:'#70411c',yellow:'#6f5b24',green:'#2f6245',mint:'#2e6d69',sky:'#41658d',blue:'#374f95',purple:'#4a376c',pink:'#7a496a',silver:'#7d808c',navy:'#1e2442',rainbow:'#43345d'};
    document.documentElement.style.setProperty('--char-dark',darkMap[answers.color.id]||'#2f2741');
  }
}
function choose(key,value){
  if(transitioning||!value)return;
  transitioning=true;
  answers[key]=value;
  restoreChamber();updatePreviewCharacter();els.preview.classList.add('show');
  const idx=FLOW.findIndex(x=>x.key===key);animateIngredient(idx,key==='color'?value.hex:null);
  setTimeout(()=>{transitioning=false;step++; if(step>=FLOW.length)renderResult(); else renderQuestion();},220);
}
function renderQuestion(){
  document.querySelector('.dialogue-section').scrollTop=0;
  updateHud();restoreChamber();if(Object.keys(answers).length){updatePreviewCharacter();els.preview.classList.add('show')}else{els.preview.classList.remove('show')}document.getElementById('spark1').classList.remove('show');document.getElementById('spark2').classList.remove('show');
  const q=FLOW[step];let html=`<div class="q-title">${q[lang].title}</div><div class="q-hint">${q[lang].hint}</div><div class="options-box">`;
  if(q.type==='place'){
    PLACE_GROUPS.forEach(g=>{html+=`<div class="group-header"><span>${g.icon}</span>${g[lang]}</div>`;g.options.forEach((o)=>{html+=`<button class="option-btn ${selectedFor('place',o.ko)}" data-type="place" data-id="${o.ko}"><div class="option-icon">${g.icon}</div><span>${o[lang]}</span></button>`})});
  }
  if(q.type==='style') STYLES.forEach(o=>html+=`<button class="option-btn ${selectedFor('style',o.id)}" data-type="style" data-id="${o.id}"><div class="option-icon pixel-icon">${o.icon}</div><span>${o[lang]}</span><span class="style-label">${lang==='ko'?o.descKo:o.descEn}</span></button>`);
  if(q.type==='color') COLORS.forEach(o=>html+=`<button class="option-btn ${selectedFor('color',o.id)}" data-type="color" data-id="${o.id}"><div class="color-swatch ${o.hex==='rainbow'?'rainbow':''}" style="${o.hex==='rainbow'?'':'background:'+o.hex}"></div><span>${o[lang]}</span></button>`);
  if(q.type==='hobby') HOBBIES.forEach(o=>html+=`<button class="option-btn ${selectedFor('hobby',o.id)}" data-type="hobby" data-id="${o.id}"><div class="option-icon">${o.icon}</div><span>${o[lang]}</span></button>`);
  if(q.type==='personality'||q.type==='mission') (q.type==='personality'?PERSONALITIES:MISSIONS).forEach(o=>html+=`<button class="option-btn ${selectedFor(q.key,o.id)}" data-type="${q.type}" data-id="${o.id}"><div class="option-icon">${o.icon}</div><span>${o[lang]}</span><span class="style-label">${lang==='ko'?o.descKo:o.descEn}</span></button>`);
  html+='</div>';els.content.innerHTML=html;
  els.content.querySelectorAll('.option-btn').forEach(btn=>btn.addEventListener('click',()=>{
    const t=btn.dataset.type,id=btn.dataset.id;
    let val;if(t==='place'){for(const g of PLACE_GROUPS){const found=g.options.find(x=>x.ko===id);if(found){val={id:found.ko,ko:found.ko,en:found.en};break}}}
    if(t==='style')val=STYLES.find(x=>x.id===id);if(t==='color')val=COLORS.find(x=>x.id===id);if(t==='hobby')val=HOBBIES.find(x=>x.id===id);
    if(t==='personality')val=PERSONALITIES.find(x=>x.id===id);if(t==='mission')val=MISSIONS.find(x=>x.id===id);
    choose(t,val);
  }));
}

  return EXHIBIT_RECOMMENDATIONS.map((item,index)=>({item,index,score:(item.hall===answers.place?.ko?100:0)+(item.tags.includes(answers.hobby?.id)?10:0)+(answers.mission?.tags.some(t=>item.tags.includes(t))?6:0)})).sort((a,b)=>b.score-a.score||a.index-b.index)[0].item;
}

function buildPrompt(){
  const p=answers.place,s=answers.style,c=answers.color,h=answers.hobby;
  if(lang==='ko') return `국립과천과학관의 ‘${p.ko}’을 배경으로, ‘${h.ko}’을 좋아하는 오리지널 과학 탐험 캐릭터 1명을 만들어줘. 캐릭터의 메인 컬러는 ${c.ko}이고, ${s.promptKo} 표현해줘. 캐릭터는 ${answers.personality.promptKo}을 지녔고, ${answers.mission.promptKo}에 도전하고 있어. 성격은 표정과 자세로, 미션은 작은 소품으로 표현해줘. 취미가 한눈에 보이도록 ${h.gearKo} 같은 소품을 자연스럽게 착용하거나 들고 있게 해줘. 과학관 공간의 특징은 알아볼 수 있게 살리되 캐릭터가 화면의 주인공이 되게 구성하고, 호기심 많고 친근한 표정으로 표현해줘. 전신이 잘 보이는 3/4 시점, 재미있는 탐험 포즈, 귀엽고 정교한 SD 치비 비율, 얼굴과 머리카락이 단순하지 않게 디테일이 살아 있는 스타일로 만들어줘. 특히 픽셀 아트 스타일을 선택한 경우에는 픽셀을 조금 더 잘게 쪼갠 정교한 도트 표현으로, 큰 머리와 작은 몸 비율, 층이 느껴지는 앞머리와 옆머리, 작은 눈과 볼터치, 또렷한 검은 외곽선, 게임 캐릭터 스프라이트 같은 높은 완성도를 살려줘. 전체 분위기는 신비로운 과학 연구실과 마법학교 판타지 감성이 살짝 섞인 모험 느낌이 나게 하고, 과도하게 어둡거나 무섭지 않게. 글자, 로고, 워터마크는 넣지 말고 세로 4:5 비율의 고해상도 캐릭터 이미지로 만들어줘.`;
  return `Create one original science-explorer character in the “${p.en}” area of Gwacheon National Science Museum. The character loves ${h.en}, uses ${c.en} as the main accent color, and should be rendered as ${s.promptEn}. Give the character ${answers.personality.promptEn}, taking on ${answers.mission.promptEn}. Express the personality through the face and pose, and suggest the mission through a small prop. Make the hobby instantly readable through props such as ${h.gearEn}. Keep recognizable science-museum cues in the background, but make the character the clear focal point. Show a friendly, curious expression, a full-body 3/4 view, and an adventurous pose. Use cute but polished SD chibi proportions, and keep the face and hairstyle visually detailed rather than overly simple. If the pixel-art style is selected, emphasize finer, smaller pixel detailing with a sprite-like finish, a large head, small body, layered bangs and side hair, tiny eyes with a soft blush, bold black outlines, and a refined retro game character look. Add a subtle mysterious science-lab adventure atmosphere mixed with a light fantasy-school mood, without making it too dark or scary. No text, logos, or watermarks. High-resolution vertical 4:5 character image.`;
}

function updatePreviewCharacter(){
 document.getElementById('previewCharacter').innerHTML=characterPixels();
 updatePreviewBackground();
 els.preview.setAttribute('aria-label',lang==='ko'?`${answers.color?.ko||''} ${answers.hobby?.ko||'과학 탐험'} 픽셀 캐릭터`:`${answers.color?.en||''} ${answers.hobby?.en||'Science explorer'} pixel character`);
}

function updatePreviewBackground(){const r=recommendExhibit();document.getElementById("previewBackground").innerHTML=PIXEL_HALL_BACKGROUNDS[r.slug];els.preview.setAttribute("role","img");els.preview.setAttribute("aria-label",lang==="ko"?r.hall+" 픽셀 배경과 캐릭터":r.hallEn+" pixel background and character");}
function renderResult(){
  document.querySelector('.dialogue-section').scrollTop=0;
  updatePreviewCharacter();
  step=FLOW.length;updateHud();restoreChamber();els.preview.classList.add('show');document.getElementById('spark1').classList.add('show');document.getElementById('spark2').classList.add('show');
  const prompt=buildPrompt();const p=answers.place,s=answers.style,c=answers.color,h=answers.hobby;
  const guide = lang==='ko' ? [
    ['픽셀 미리보기','상단 캐릭터에 색상 · 취미 소품 · 성격 · 미션이 반영돼요.'],
    ['AI 이미지 프롬프트','선택한 이미지 스타일은 아래 프롬프트에 적용돼요. 복사해서 AI 이미지 만들기에 사용하세요.'],
    ['전시 숏폼 아이디어','프롬프트 아래에서 전시와 연결되는 짧은 영상 아이디어를 확인하세요.']
  ] : [
    ['Pixel preview','Your color, hobby props, personality and mission appear in the character above.'],
    ['AI image prompt','Your selected image style is applied to the prompt below. Copy it to create an AI image.'],
    ['Exhibit short-form idea','Find a short video idea connected to an exhibit below the prompt.']
  ];
  const refTip = `<section class="result-note" aria-label="${lang==='ko'?'결과 활용 안내':'How to use your results'}"><h3 class="guide-heading">${lang==='ko'?'캐릭터 완성! 이렇게 활용해요':'CHARACTER READY · NEXT STEPS'}</h3>${guide.map((item,i)=>`<div class="guide-step" style="--guide-color:${['#8ff6e8','#cbb3ff','#ffd580'][i]}"><span class="guide-number">0${i+1}</span><div><strong>${item[0]}</strong><p>${item[1]}</p></div></div>`).join('')}</section>`;

  els.content.innerHTML=`<div class="result-title">${I18N[lang].result}</div><div class="result-summary"><div class="summary-chip">🏛️ ${p[lang]}</div><div class="summary-chip">🎨 ${s[lang]}</div><div class="summary-chip">🌈 ${c[lang]}</div><div class="summary-chip">${h.icon} ${h[lang]}</div><div class="summary-chip">${answers.personality.icon} ${answers.personality[lang]}</div><div class="summary-chip">${answers.mission.icon} ${answers.mission[lang]}</div></div>${refTip}<h3 class="result-section-label">${lang==='ko'?'AI 이미지 프롬프트':'AI IMAGE PROMPT'}</h3><div class="result-card" id="promptText">${prompt}</div>${recommendationHtml()}<div class="btn-row"><button class="action-btn copy" id="copyBtn">${I18N[lang].copy}</button><button class="action-btn restart" id="restartBtn">${I18N[lang].restart}</button></div>`;
  document.getElementById('copyBtn').addEventListener('click',()=>copyText(prompt));
  document.getElementById('restartBtn').addEventListener('click',()=>{answers={};step=0;for(let i=1;i<=FLOW.length;i++){const orb=document.getElementById('orb'+i);orb.classList.remove('show');orb.style.background='';}renderQuestion()});
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
  alert(I18N[lang].copied);
}
function switchLang(next){lang=next;document.getElementById('btnKO').classList.toggle('active',lang==='ko');document.getElementById('btnEN').classList.toggle('active',lang==='en');if(step>=FLOW.length&&answers.place)renderResult();else renderQuestion()}
document.getElementById('btnKO').addEventListener('click',()=>switchLang('ko'));document.getElementById('btnEN').addEventListener('click',()=>switchLang('en'));
els.back.addEventListener('click',()=>{if(transitioning||step<=0||step>=FLOW.length)return;const key=FLOW[step-1].key;delete answers[key];step--;renderQuestion()});
renderQuestion();
</script>
