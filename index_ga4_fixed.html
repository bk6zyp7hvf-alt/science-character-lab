.lab-room:before{content:"";position:absolute;left:0;right:0;top:0;height:7px;background:repeating-linear-gradient(90deg,#241a31 0 12px,#3d2a50 12px 24px);border-bottom:3px solid #17121c;z-index:2}

.dialogue-section{flex:1;min-height:0;padding:12px;background:linear-gradient(180deg,#e7e2d8,#d6d0c5);overflow-y:auto}

/* wall: smaller stone blocks + tiny wear pixels */
.stone-wall{
  inset:0 0 64px;
  background-color:#c8c4bb;
  background-image:
    linear-gradient(90deg,transparent 0 7px,rgba(75,65,78,.13) 7px 8px,transparent 8px 15px),
    linear-gradient(transparent 0 7px,rgba(75,65,78,.13) 7px 8px,transparent 8px 15px),
    linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px);
  background-size:16px 12px,16px 12px,8px 8px,8px 8px;
  opacity:1;
}
.stone-wall:before{
  content:"";position:absolute;inset:8px 9px 4px;
  background:
    linear-gradient(90deg,transparent 0 2px,#8f8b87 2px 3px,transparent 3px) 10px 18px/37px 31px,
    linear-gradient(transparent 0 2px,#9d9892 2px 3px,transparent 3px) 24px 7px/51px 29px;
  opacity:.28;

let lang='ko',step=0,answers={},transitionLocked=false;
const els={header:document.getElementById('headerTitle'),status:document.getElementById('labStatus'),back:document.getElementById('btnBack'),counter:document.getElementById('stepCounter'),dots:document.getElementById('stepDots'),content:document.getElementById('contentArea'),scientist:document.getElementById('scientist'),preview:document.getElementById('charPreview')};
const dialogueSection=document.querySelector('.dialogue-section');

function trackEvent(name,params={}){
  if(window.__ga4Enabled && typeof window.gtag==='function') window.gtag('event',name,params);
}
function resetDialogueScroll(){
  if(!dialogueSection) return;
  requestAnimationFrame(()=>{ dialogueSection.scrollTop=0; });
}
function label(obj){return obj[lang]}
function updateHud(){
  const txt=I18N[lang]; els.header.textContent=txt.header; els.status.textContent= step>=FLOW.length ? txt.complete : txt.status; els.back.textContent=txt.back;
  if(step>=FLOW.length){els.counter.textContent='LAB DONE';els.dots.innerHTML=FLOW.map(()=>'<div class="step-dot done"></div>').join('');els.back.classList.add('is-hidden');return}
  els.counter.textContent=`LAB 0${step+1} / 0${FLOW.length}`;
  els.dots.innerHTML=FLOW.map((_,i)=>`<div class="step-dot ${i<step?'done':i===step?'active':''}"></div>`).join('');
  els.back.classList.toggle('is-hidden',step===0);
}
function selectedFor(key,id){return answers[key]&&answers[key].id===id?'selected':''}
function animateIngredient(index,color){
  const orb=document.getElementById('orb'+(index+1));orb.classList.add('show');if(color)orb.style.background=color==='rainbow'?'linear-gradient(135deg,#ff5858,#ffe45e,#6fe081,#62c7ff,#cf68e8)':color;
  els.scientist.classList.remove('cheer');void els.scientist.offsetWidth;els.scientist.classList.add('cheer');
}
function restoreChamber(){
  for(let i=0;i<4;i++){const orb=document.getElementById('orb'+(i+1));orb.classList.toggle('show',!!answers[FLOW[i].key]);}
  if(answers.color){
    const c=answers.color.hex==='rainbow'?'#9a69db':answers.color.hex;
    document.documentElement.style.setProperty('--char-color',c);
    const darkMap={red:'#6d2f35',orange:'#70411c',yellow:'#6f5b24',green:'#2f6245',mint:'#2e6d69',sky:'#41658d',blue:'#374f95',purple:'#4a376c',pink:'#7a496a',silver:'#7d808c',navy:'#1e2442',rainbow:'#43345d'};
    document.documentElement.style.setProperty('--char-dark',darkMap[answers.color.id]||'#2f2741');
  }
}
function choose(key,value){
  if(transitionLocked || !value) return;
  transitionLocked=true;
  answers[key]=value;
  trackEvent('character_option_selected',{step:key,option_id:value.id||value.ko||'unknown',language:lang});
  const idx=FLOW.findIndex(x=>x.key===key);animateIngredient(idx,key==='color'?value.hex:null);
  setTimeout(()=>{
    step++;
    if(step>=FLOW.length) renderResult(); else renderQuestion();
    transitionLocked=false;
  },220);
}
function renderQuestion(){
  updateHud();restoreChamber();els.preview.classList.remove('show');document.getElementById('spark1').classList.remove('show');document.getElementById('spark2').classList.remove('show');
  const q=FLOW[step];let html=`<div class="q-title">${q[lang].title}</div><div class="q-hint">${q[lang].hint}</div><div class="options-box">`;
  if(q.type==='place'){
    PLACE_GROUPS.forEach(g=>{html+=`<div class="group-header"><span>${g.icon}</span>${g[lang]}</div>`;g.options.forEach((o)=>{html+=`<button class="option-btn ${selectedFor('place',o.ko)}" data-type="place" data-id="${o.ko}"><div class="option-icon">${g.icon}</div><span>${o[lang]}</span></button>`})});
  }
  if(q.type==='style') STYLES.forEach(o=>html+=`<button class="option-btn ${selectedFor('style',o.id)}" data-type="style" data-id="${o.id}"><div class="option-icon pixel-icon">${o.icon}</div><span>${o[lang]}</span><span class="style-label">${lang==='ko'?o.descKo:o.descEn}</span></button>`);
  if(q.type==='color') COLORS.forEach(o=>html+=`<button class="option-btn ${selectedFor('color',o.id)}" data-type="color" data-id="${o.id}"><div class="color-swatch ${o.hex==='rainbow'?'rainbow':''}" style="${o.hex==='rainbow'?'':'background:'+o.hex}"></div><span>${o[lang]}</span></button>`);
  if(q.type==='hobby') HOBBIES.forEach(o=>html+=`<button class="option-btn ${selectedFor('hobby',o.id)}" data-type="hobby" data-id="${o.id}"><div class="option-icon">${o.icon}</div><span>${o[lang]}</span></button>`);
  html+='</div>';els.content.innerHTML=html;
  resetDialogueScroll();
  els.content.querySelectorAll('.option-btn').forEach(btn=>btn.addEventListener('click',()=>{
    const t=btn.dataset.type,id=btn.dataset.id;
    let val;if(t==='place'){for(const g of PLACE_GROUPS){const found=g.options.find(x=>x.ko===id);if(found){val={id:found.ko,ko:found.ko,en:found.en};break}}}
    if(t==='style')val=STYLES.find(x=>x.id===id);if(t==='color')val=COLORS.find(x=>x.id===id);if(t==='hobby')val=HOBBIES.find(x=>x.id===id);
    choose(t,val);
  }));
}
function buildPrompt(){
  const p=answers.place,s=answers.style,c=answers.color,h=answers.hobby;
  if(lang==='ko') return `국립과천과학관의 ‘${p.ko}’을 배경으로, ‘${h.ko}’을 좋아하는 오리지널 과학 탐험 캐릭터 1명을 만들어줘. 캐릭터의 메인 컬러는 ${c.ko}이고, ${s.promptKo} 표현해줘. 취미가 한눈에 보이도록 ${h.gearKo} 같은 소품을 자연스럽게 착용하거나 들고 있게 해줘. 과학관 공간의 특징은 알아볼 수 있게 살리되 캐릭터가 화면의 주인공이 되게 구성하고, 호기심 많고 친근한 표정으로 표현해줘. 전신이 잘 보이는 3/4 시점, 재미있는 탐험 포즈, 귀엽고 정교한 SD 치비 비율, 얼굴과 머리카락이 단순하지 않게 디테일이 살아 있는 스타일로 만들어줘. 특히 픽셀 아트 스타일을 선택한 경우에는 픽셀을 조금 더 잘게 쪼갠 정교한 도트 표현으로, 큰 머리와 작은 몸 비율, 층이 느껴지는 앞머리와 옆머리, 작은 눈과 볼터치, 또렷한 검은 외곽선, 게임 캐릭터 스프라이트 같은 높은 완성도를 살려줘. 전체 분위기는 신비로운 과학 연구실과 마법학교 판타지 감성이 살짝 섞인 모험 느낌이 나게 하고, 과도하게 어둡거나 무섭지 않게. 글자, 로고, 워터마크는 넣지 말고 세로 4:5 비율의 고해상도 캐릭터 이미지로 만들어줘.`;
  return `Create one original science-explorer character in the “${p.en}” area of Gwacheon National Science Museum. The character loves ${h.en}, uses ${c.en} as the main accent color, and should be rendered as ${s.promptEn}. Make the hobby instantly readable through props such as ${h.gearEn}. Keep recognizable science-museum cues in the background, but make the character the clear focal point. Show a friendly, curious expression, a full-body 3/4 view, and an adventurous pose. Use cute but polished SD chibi proportions, and keep the face and hairstyle visually detailed rather than overly simple. If the pixel-art style is selected, emphasize finer, smaller pixel detailing with a sprite-like finish, a large head, small body, layered bangs and side hair, tiny eyes with a soft blush, bold black outlines, and a refined retro game character look. Add a subtle mysterious science-lab adventure atmosphere mixed with a light fantasy-school mood, without making it too dark or scary. No text, logos, or watermarks. High-resolution vertical 4:5 character image.`;
}
function renderResult(){
  step=FLOW.length;updateHud();restoreChamber();els.preview.classList.add('show');document.getElementById('spark1').classList.add('show');document.getElementById('spark2').classList.add('show');
  const prompt=buildPrompt();const p=answers.place,s=answers.style,c=answers.color,h=answers.hobby;
  const refTip = lang==='ko' ? '<div class="result-note">캐릭터뿐 아니라 연구실 소품과 배경도 작은 픽셀 단위로 촘촘하게 보이도록 전체 그래픽을 미세 픽셀 스타일로 맞췄어요.</div>' : '<div class="result-note">The prompt has been strengthened to favor an SD chibi sprite with finer pixel detail, a large head, a small body, and more detailed hair styling.</div>';
  els.content.innerHTML=`<div class="result-title">${I18N[lang].result}</div><div class="result-summary"><div class="summary-chip">🏛️ ${p[lang]}</div><div class="summary-chip">🎨 ${s[lang]}</div><div class="summary-chip">🌈 ${c[lang]}</div><div class="summary-chip">${h.icon} ${h[lang]}</div></div>${refTip}<div class="result-card" id="promptText">${prompt}</div><div class="btn-row"><button class="action-btn copy" id="copyBtn">${I18N[lang].copy}</button><button class="action-btn restart" id="restartBtn">${I18N[lang].restart}</button></div>`;
  resetDialogueScroll();
  trackEvent('character_prompt_completed',{place:p.id||p.ko,style:s.id,color:c.id,hobby:h.id,language:lang});
  document.getElementById('copyBtn').addEventListener('click',()=>copyText(prompt));
  document.getElementById('restartBtn').addEventListener('click',()=>{trackEvent('character_lab_restarted',{language:lang});answers={};step=0;transitionLocked=false;for(let i=1;i<=4;i++){const orb=document.getElementById('orb'+i);orb.classList.remove('show');orb.style.background='';}renderQuestion()});
}
async function copyText(text){
  try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
  trackEvent('character_prompt_copied',{language:lang});
  alert(I18N[lang].copied);
}
function switchLang(next){lang=next;trackEvent('language_changed',{language:lang});document.getElementById('btnKO').classList.toggle('active',lang==='ko');document.getElementById('btnEN').classList.toggle('active',lang==='en');if(step>=FLOW.length&&answers.place)renderResult();else renderQuestion()}
document.getElementById('btnKO').addEventListener('click',()=>switchLang('ko'));document.getElementById('btnEN').addEventListener('click',()=>switchLang('en'));
els.back.addEventListener('click',()=>{if(step<=0||step>=FLOW.length)return;const key=FLOW[step-1].key;delete answers[key];step--;renderQuestion()});
renderQuestion();
</script>
</body>
</html>
